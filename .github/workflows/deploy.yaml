name: Deploy Multi-Agent to GCP VM

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '배포 대상 선택'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - docker-only
          - dashboard-only

env:
  PROJECT_ID: "REDACTED_GCP_PROJECT"
  GAR_LOCATION: "us-west1"
  REPOSITORY: "mcp-repo"
  IMAGE: "multi-agent-mcp"
  VM_IP: "REDACTED_VM_IP"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 구글 클라우드 로그인
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Docker 로그인 (Artifact Registry)
      - name: Docker Auth
        if: ${{ github.event.inputs.deploy_target != 'dashboard-only' }}
        id: docker-auth
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      # 3. Docker Buildx 설정 (캐시 지원)
      - name: Set up Docker Buildx
        if: ${{ github.event.inputs.deploy_target != 'dashboard-only' }}
        uses: docker/setup-buildx-action@v3

      # 4. Multi-Agent 이미지 빌드 & Push (캐시 활용)
      - name: Build and Push Container
        if: ${{ github.event.inputs.deploy_target != 'dashboard-only' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Docker 배포 (VM에 SSH)
      - name: Deploy Docker to VM
        if: ${{ github.event.inputs.deploy_target != 'dashboard-only' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VM_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            # Docker 권한 재확인
            gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

            # 기존 컨테이너 중지 및 삭제
            docker stop mcp-server-multi || true
            docker rm mcp-server-multi || true

            # 새 이미지 가져오기
            docker pull ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

            # Multi-Agent 서버 실행
            mkdir -p ~/mcp_data/multi/db
            mkdir -p ~/mcp_data/multi/chromadb
            docker run -d \
              --name mcp-server-multi \
              --restart unless-stopped \
              -p 9000:9000 \
              -p 9001:9001 \
              -v /home/deploy/mcp_data/multi/db:/app/data/multi/db \
              -v /home/deploy/mcp_data/multi/chromadb:/app/data/multi/chromadb \
              -e MCP_MODE="sse" \
              -e MCP_PORT="9000" \
              -e LOG_API_PORT="9001" \
              -e CHROMA_PERSIST_DIR="/app/data/multi/chromadb" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e SF_CLIENT_ID="${{ secrets.SF_CLIENT_ID }}" \
              -e SF_USERNAME="${{ secrets.SF_USERNAME }}" \
              -e SF_PRIVATE_KEY="${{ secrets.SF_PRIVATE_KEY }}" \
              -e GMAIL_CREDENTIALS="${{ secrets.GMAIL_CREDENTIALS }}" \
              -e GMAIL_TOKEN="${{ secrets.GMAIL_TOKEN }}" \
              -e GMAIL_TOKEN_FINANCE="${{ secrets.GMAIL_TOKEN_FINANCE }}" \
              ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

            echo "✅ Docker 배포 완료"

      # 6. 대시보드 배포 (VM에 SSH)
      - name: Deploy Dashboard to VM
        if: ${{ github.event.inputs.deploy_target != 'docker-only' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VM_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            # 소스코드 동기화
            echo "=== 소스코드 동기화 ==="
            cd ~
            sudo rm -rf ai_mcp_multi_agent || true
            git clone https://${{ secrets.GH_TOKEN }}@github.com/ai_mcp_multi_agent/ai_mcp_multi_agent.git || echo "WARNING: git clone 실패"

            # 대시보드 실행 (한글 + 영어)
            if [ -d ~/ai_mcp_multi_agent ]; then
              echo "=== 대시보드 설정 ==="
              kill $(lsof -t -i:9501) 2>/dev/null || true
              kill $(lsof -t -i:9502) 2>/dev/null || true
              cd ~/ai_mcp_multi_agent
              pip install streamlit pandas --quiet 2>/dev/null || true
              nohup ~/.local/bin/streamlit run dashboard.py --server.port 9501 --server.address 0.0.0.0 > /dev/null 2>&1 &
              nohup ~/.local/bin/streamlit run dashboard_en.py --server.port 9502 --server.address 0.0.0.0 > /dev/null 2>&1 &
              echo "✅ Dashboard (KR): http://${{ env.VM_IP }}:9501"
              echo "✅ Dashboard (EN): http://${{ env.VM_IP }}:9502"
            else
              echo "WARNING: 소스코드 없음 - 대시보드 건너뜀"
            fi

      # 7. 상태 확인
      - name: Verify Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VM_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 1m
          script: |
            echo "=== 서버 상태 확인 ==="
            docker logs mcp-server-multi --tail 10 2>&1 || true
            echo ""
            echo "=== 엔드포인트 ==="
            echo "  MCP: http://${{ env.VM_IP }}:9000/mcp?user_id=admin"
            echo "  Log API: http://${{ env.VM_IP }}:9001"
            echo "  Dashboard (KR): http://${{ env.VM_IP }}:9501"
            echo "  Dashboard (EN): http://${{ env.VM_IP }}:9502"
            echo ""
            echo "=== 컨테이너 ==="
            docker ps --format "table {{.Names}}\t{{.Ports}}\t{{.Status}}"
